version: 0.2

phases:
   install:
      runtime-versions:
         nodejs: 22
      commands:
         - npm ci

   pre_build:
      commands:
         - npm run lint
         - npm run prettier
         - npm run test
         - npm run cy:verify
         - npm run cy:info

   build:
      commands:
         - npm run build
         - npm run start:ci & 
         - npx cypress run --record
