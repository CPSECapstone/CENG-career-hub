version: 0.2

phases:
   install:
      runtime-versions:
         nodejs: 22
      commands:
         - npm ci

   pre_build:
      commands:
         - npm run lint
         - npm run prettier
         - npm run test
         - npm run cy:verify

   build:
      commands:
         - npm run build
         - npm run cy:component
         - npm run start:ci > /tmp/next.log 2>&1 &
         - npx wait-on --timeout 60000 http://localhost:3000
         - npm run cy:e2e
